<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>彩潮 · CHROMA TIDE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="fx2d"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>

  <!-- ============ HUD ============ -->
  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="hud-left">
        <div class="hp-row">
          <svg class="hp-ic" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M24 41C10 30.5 6 22.5 8.6 16.4 10.8 11 16.5 9.2 21 12.4L24 15l3-2.6c4.5-3.2 10.2-1.4 12.4 4C42 22.5 38 30.5 24 41z" fill="#C85C6A" stroke="#1A1714" stroke-width="2.5"/>
            <path d="M19.5 19c-2.6 1-3.6 3.6-3 6.4" fill="none" stroke="#F2E8D5" stroke-width="2" stroke-linecap="round" opacity=".8"/>
          </svg>
          <div class="hp-track"><div id="hp-fill"></div></div>
          <b id="hp-text">100</b>
        </div>
        <div class="lv-row">
          <span class="lv-badge">Lv<b id="lv">1</b></span>
          <div class="xp-track"><div id="xp-fill"></div></div>
        </div>
      </div>
      <div class="hud-right">
        <div class="stat"><em>时间</em><b id="time">0:00</b></div>
        <div class="stat"><em>收割</em><b id="kills">0</b></div>
        <button id="btn-pause" class="icon-btn" aria-label="暂停"><i></i><i></i></button>
      </div>
    </div>

    <div id="bossbar" class="hidden">
      <div class="boss-top"><strong id="boss-name">墨渊巨像</strong><em>BOSS</em></div>
      <div class="boss-track"><div id="boss-fill"></div></div>
    </div>

    <div id="combo" class="hidden"><em>×</em><b id="combo-n">0</b><span>连斩</span></div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ============ 操作 ============ -->
  <div id="controls" class="hidden">
    <div id="stick-zone"></div>
    <div id="stick" class="hidden"><div class="stick-base"></div><div class="stick-knob"></div></div>
    <div class="actions">
      <button id="btn-ult" class="act ult" aria-label="万彩归一"></button>
      <button id="btn-dash" class="act dash" aria-label="闪身"></button>
    </div>
  </div>

  <!-- ============ 标题 ============ -->
  <div id="screen-title" class="screen title-screen hidden">
    <div class="wash w1"></div>
    <div class="wash w2"></div>
    <div class="title-inner">
      <div class="eyebrow">CHROMA TIDE</div>
      <h1 class="logo"><span>彩</span><span>潮</span></h1>
      <div class="logo-rule"></div>
      <p class="tagline">把颜色，还给荒原。</p>
      <div class="best-line" id="best-line">尚无记录 · 第一笔由你落下</div>
      <button id="btn-start" class="btn-primary btn-start">开始收割</button>
      <div class="title-links">
        <button id="btn-help" class="btn-link">玩法</button>
        <button id="btn-sound" class="btn-link">音效 · 开</button>
        <button id="btn-save" class="btn-link">存档</button>
      </div>
      <div class="title-note">竖屏 · 自动攻击 · 单局 6 分钟</div>
    </div>
  </div>

  <!-- ============ 升级 ============ -->
  <div id="screen-levelup" class="screen hidden">
    <div class="panel level-panel">
      <div class="panel-kicker">颜色在你体内翻涌</div>
      <h2>选择一笔</h2>
      <div id="cards" class="cards"></div>
      <div class="key-hint">点击卡牌 · 或按 1 / 2 / 3</div>
    </div>
  </div>

  <!-- ============ 暂停 ============ -->
  <div id="screen-pause" class="screen hidden">
    <div class="panel">
      <div class="panel-kicker">墨潮暂歇</div>
      <h2>停笔</h2>
      <div id="pause-stats"></div>
      <div class="panel-actions">
        <button id="btn-resume" class="btn-primary">继续</button>
        <div class="row">
          <button id="btn-restart" class="btn-ghost">重新开始</button>
          <button id="btn-quit" class="btn-ghost">回到标题</button>
        </div>
        <div class="row small">
          <button id="btn-help2" class="btn-link">玩法</button>
          <button id="btn-save2" class="btn-link">存档</button>
          <button id="btn-sound2" class="btn-link">音效 · 开</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 结算 ============ -->
  <div id="screen-end" class="screen hidden">
    <div class="panel end-panel">
      <div class="panel-kicker" id="end-kicker"></div>
      <h2 id="end-title">潮水退去</h2>
      <div id="end-stats"></div>
      <div id="end-best"></div>
      <div class="panel-actions">
        <button id="btn-again" class="btn-primary">再来一局</button>
        <button id="btn-home" class="btn-ghost">回到标题</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹窗 ============ -->
  <div id="modal" class="screen hidden">
    <div class="panel modal-panel">
      <h2 id="modal-title">玩法</h2>
      <div id="modal-body"></div>
      <button id="modal-close" class="btn-primary">知道了</button>
    </div>
  </div>

  <div id="loading">
    <div class="load-mark">彩潮</div>
    <div class="load-sub">研墨中</div>
    <div class="load-bar"><i></i></div>
  </div>
  <input id="file-input" type="file" accept="application/json" hidden>
</div>

<script src="js/three.min.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
window.addEventListener('load', function () {
  try { CT.Game.boot(); }
  catch (err) {
    document.getElementById('loading').innerHTML = '<div class="load-mark">启动失败</div><div class="load-sub">' + (err && err.message ? err.message : '未知错误') + '</div>';
    console.error(err);
  }
});
document.addEventListener('pointerdown', function () { if (window.CT && CT.Sound) CT.Sound.resume(); }, { once: true });
(function () {
  var local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  if ('serviceWorker' in navigator && !/[?&]app=1/.test(location.search) && !local && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () { }); });
  }
})();
</script>
</body>
</html>
